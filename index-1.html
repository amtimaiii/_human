<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>凡人修仙錄</title>
<meta name="description" content="把現實習慣變成修仙的打卡遊戲：每天打卡累積修為，突破境界。">
<meta name="theme-color" content="#dde5df" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="修仙錄">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --serif:'Noto Serif TC','Songti TC','Source Han Serif TC','PMingLiU',serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC',system-ui,sans-serif;
  --bg:#dde5df; --bg2:#e8eee9; --paper:#f1f5f0; --ink:#14201d; --ink2:#4d5f59; --ink3:#8a9a94;
  --line:#c3cfc8; --track:#d0dbd4; --jade:#1d6b5e; --glow:#3fa792; --gold:#a9822f; --seal:#b83a2c;
  --nav:rgba(232,238,233,.88); --chip:#e3ebe5; --mist1:rgba(63,167,146,.16); --mist2:rgba(169,130,47,.09);
  --shadow:0 18px 30px -22px rgba(20,32,29,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(700px 420px at 90% -8%,var(--mist1),transparent 65%),radial-gradient(620px 460px at -12% 38%,var(--mist2),transparent 65%)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:14px 16px 104px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{font-family:var(--serif);font-weight:900;font-size:19px;letter-spacing:.18em}
.iconbtn{border:1px solid var(--line);background:var(--paper);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink2)}

/* seal */
.seal{display:inline-grid;place-items:center;background:var(--seal);color:#fff;font-family:var(--serif);font-weight:900;border-radius:3px;transform:rotate(-5deg);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),inset 0 0 0 3px var(--seal)}

/* hero scroll */
.hero{position:relative;background:var(--paper);border-left:1px solid var(--line);border-right:1px solid var(--line);padding:26px 18px 16px;box-shadow:var(--shadow);overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;left:-6px;right:-6px;height:9px;background:var(--ink);border-radius:5px;opacity:.88}
.hero::before{top:0}.hero::after{bottom:0}
.mount{position:absolute;left:0;right:0;bottom:8px;width:100%;height:120px;color:var(--jade);pointer-events:none}
.orbs i{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px 3px var(--glow);opacity:0;animation:drift 7s ease-in infinite}
.orbs i:nth-child(1){left:52%;bottom:60px;animation-delay:0s}
.orbs i:nth-child(2){left:64%;bottom:48px;animation-delay:1.6s}
.orbs i:nth-child(3){left:78%;bottom:66px;animation-delay:3.1s}
.orbs i:nth-child(4){left:88%;bottom:40px;animation-delay:4.4s}
.orbs i:nth-child(5){left:44%;bottom:44px;animation-delay:5.5s}
.hero-body{position:relative;display:flex;gap:16px;align-items:flex-start}
.realm-v{display:flex;flex-direction:column;align-items:center;font-family:var(--serif);font-weight:900;font-size:40px;color:var(--ink);padding-right:14px;border-right:1px solid var(--line);min-height:150px}
.realm-v span{display:block;line-height:1.14}
.hero-meta{flex:1;min-width:0}
.dao{font-family:var(--serif);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.dayline{color:var(--ink2);font-size:13px;margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.dayline b{font-family:var(--serif);color:var(--gold);font-weight:700}
.xp{margin-top:14px;display:flex;align-items:baseline;gap:6px}
.xp b{font-family:var(--serif);font-weight:900;font-size:40px;line-height:1}
.xp span{color:var(--ink2);font-size:13px}
.qi-wrap{position:relative;margin-top:16px}
.qi{height:9px;border-radius:99px;background:var(--track);overflow:hidden}
.qi i{display:block;height:100%;width:0;border-radius:inherit;background:var(--jade);box-shadow:0 0 12px 1px var(--glow);position:relative;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.qi i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:sheen 3s ease-in-out infinite}
.qi-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative}
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;background:var(--chip);border:1px solid var(--line);color:var(--ink2);font-size:12px}
.chip.lock{opacity:.42}
.chip.gold{color:var(--gold);border-color:var(--gold)}

/* generic blocks */
.block{margin-top:20px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;font-family:var(--serif);font-weight:700;font-size:17px;padding-bottom:6px;border-bottom:2px solid var(--ink);margin-bottom:2px}
.block-h small{font-family:var(--sans);font-weight:400;font-size:13px;color:var(--ink2)}
.note{color:var(--ink2);font-size:13px}
.banner{margin-top:12px;padding:10px 12px;border-left:3px solid var(--gold);background:var(--chip);font-size:13px;color:var(--ink)}
.banner b{font-family:var(--serif)}

/* quests (烏絲欄) */
.quest{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;cursor:pointer}
.sbox{flex:none;width:40px;height:40px;border-radius:4px;border:1.5px dashed var(--ink3);display:grid;place-items:center;transition:background .2s,border-color .2s}
.sbox b{font-family:var(--serif);font-weight:900;font-size:19px;color:#fff;opacity:0;transform:rotate(-8deg)}
.quest.done .sbox{border:1.5px solid var(--seal);background:var(--seal)}
.quest.done .sbox b{opacity:1}
.quest.fresh .sbox b{animation:stamp .55s cubic-bezier(.2,1.3,.4,1)}
.quest.done .qn{color:var(--ink2)}
.qm{flex:1;min-width:0}
.qn{font-family:var(--serif);font-weight:700;font-size:16px;display:block}
.qd{font-size:12.5px;color:var(--ink2);display:block}
.qr{font-size:12px;color:var(--jade);text-align:right;line-height:1.4;flex:none}
.quest.off{opacity:.45}

/* buttons & inputs */
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.seal{background:var(--seal);border-color:var(--seal);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--ink2)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--ink);font:inherit}
label.f{display:block;font-size:13px;color:var(--ink2);margin:12px 0 4px}
.seg{display:flex;border-bottom:1px solid var(--line);margin-bottom:4px}
.seg button{flex:1;background:none;border:0;padding:10px 0;color:var(--ink2);cursor:pointer;font-family:var(--serif);font-weight:700;font-size:16px;position:relative}
.seg button.on{color:var(--ink)}
.seg button.on::after{content:"";position:absolute;left:30%;right:30%;bottom:-1px;height:3px;background:var(--seal);border-radius:2px}

/* bars */
.bar{height:7px;background:var(--track);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;background:var(--jade);border-radius:inherit;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.gold i{background:var(--gold)}
.gate{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--seal)}

/* attribute rows */
.arow{padding:12px 0;border-bottom:1px solid var(--line)}
.arow-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.arow-h b{font-family:var(--serif);font-size:16px}

/* breakthrough */
.bt{margin-top:18px;border:1.5px solid var(--gold);padding:14px 16px;background:var(--paper);position:relative}
.bt h3{margin:0 0 4px;font-family:var(--serif);font-size:17px}
.need{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.need .ok{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--track);color:var(--ink3);flex:none}
.need.met .ok{background:var(--jade);color:var(--bg)}
.need span:last-child{margin-left:auto;color:var(--ink2);font-size:13px}

/* encounter */
.enc{margin-top:18px;padding:14px 16px;border:1px solid var(--line);background:var(--paper);display:flex;gap:14px;align-items:center}
.enc .seal{width:44px;height:44px;font-size:22px;flex:none}
.enc h3{margin:0;font-family:var(--serif);font-size:16px}
.enc p{margin:0;font-size:13px;color:var(--ink2)}

/* skills */
.skill{padding:14px 0;border-bottom:1px solid var(--line)}
.skill-h{display:flex;justify-content:space-between;align-items:baseline}
.skill-h b{font-family:var(--serif);font-size:18px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:12px 0 8px}
.stats3 b{display:block;font-family:var(--serif);font-size:21px}
.stats3 span{font-size:12px;color:var(--ink2)}

/* timeline */
.tl-day{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px;font-family:var(--serif);font-weight:700;font-size:16px;padding-bottom:4px;border-bottom:1px solid var(--ink)}
.tl-day small{font-family:var(--sans);font-weight:400;color:var(--ink2);font-size:12.5px}
.ev{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.ev .g{flex:none;width:30px;height:30px;border-radius:4px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:14px;color:#fff;background:var(--jade)}
.ev.growth .g{background:var(--gold)}
.ev.encounter .g,.ev.challenge .g{background:var(--seal)}
.ev.record .g{background:var(--ink2)}
.ev.trial .g{background:var(--ink)}
.ev b{font-family:var(--serif);font-size:15px;display:block}
.ev small{color:var(--ink2);font-size:12.5px;display:block}

/* me */
.id{display:flex;gap:16px;align-items:center;margin-top:6px}
.id .seal{width:64px;height:64px;font-size:32px}
.id h2{margin:0;font-family:var(--serif);font-size:22px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin-top:16px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.grid4 b{display:block;font-family:var(--serif);font-size:19px}
.grid4 span{font-size:11.5px;color:var(--ink2)}
.tree{margin:6px 0 0 6px;border-left:2px solid var(--line);padding-left:18px}
.tree li{list-style:none;position:relative;padding:5px 0;color:var(--ink3);font-family:var(--serif)}
.tree li::before{content:"";position:absolute;left:-25px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.tree li.pass{color:var(--ink2)}.tree li.pass::before{background:var(--jade);border-color:var(--jade)}
.tree li.now{color:var(--ink);font-weight:900;font-size:17px}.tree li.now::before{background:var(--seal);border-color:var(--seal);box-shadow:0 0 0 4px rgba(184,58,44,.2)}
.tree small{font-family:var(--sans);font-weight:400;margin-left:8px;font-size:12px}
.demo{margin-top:8px;padding:12px 14px;border:1px dashed var(--ink3)}
.demo .row{margin-top:8px}

/* trial goals & evidence */
.goal{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px;cursor:pointer}
.goal.solo{border:1px solid var(--line);border-radius:12px;padding:14px 14px;background:var(--paper)}
.goal.solo .gbox{width:26px;height:26px}
.goal.solo .gt{font-size:15px}
.gbox{flex:none;width:22px;height:22px;border-radius:3px;border:1.5px solid var(--ink3);display:grid;place-items:center;font-size:13px;color:transparent;transition:background .2s}
.goal.done .gbox{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.goal.done .gt{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--ink3)}
.picks{display:flex;gap:6px}
.pick{flex:1;padding:9px 0;border:1px solid var(--line);background:transparent;border-radius:6px;cursor:pointer;color:var(--ink2);font-size:13px}
.pick.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.evid{margin-top:8px;border:1px solid var(--line);background:var(--bg2);padding:6px 14px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;font-size:14px;border-bottom:1px dotted var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--serif)}
.hint{margin-top:10px;padding:10px 12px;border-left:3px solid var(--jade);background:var(--chip);font-size:13px}

/* attributes */
.art{margin:8px -6px 0}
.art svg{display:block;width:100%;height:auto}
.aura{transform-origin:180px 112px;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.art-cap{margin:0 0 6px;text-align:center;font-family:var(--serif);color:var(--ink2);font-size:14px}
.attr{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.attr-g{flex:none;width:46px;height:46px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:24px;border:1.5px solid var(--ink);border-radius:4px;color:var(--ink);transform:rotate(-3deg)}
.attr.top .attr-g{background:var(--seal);border-color:var(--seal);color:#fff}
.attr-m{flex:1;min-width:0}
.attr-h{display:flex;align-items:baseline;gap:8px}
.attr-h b{font-family:var(--serif);font-size:17px}
.attr-h .tier{color:var(--gold);font-family:var(--serif);font-size:13px}
.attr-h em{margin-left:auto;font-style:normal;font-family:var(--serif);font-weight:900;font-size:22px}
.seg5{display:flex;gap:3px;margin:7px 0 5px}
.seg5 span{flex:1;height:7px;background:var(--track);border-radius:2px;overflow:hidden}
.seg5 i{display:block;height:100%;width:0;background:var(--jade);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.attr-f{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink2);gap:8px}
.quest.opt .sbox{border-color:var(--jade)}
.quest.opt.done .sbox{background:var(--jade);border-color:var(--jade)}
.quest.opt .qr{color:var(--ink2)}

/* tutorial */
#tut{position:fixed;inset:0;z-index:95;display:none;background:rgba(6,12,10,.66);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow:auto}
#tut.on{display:flex;align-items:center;justify-content:center;padding:70px 16px 24px}
.tex{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:96;border:1px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:99px;padding:8px 16px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.tcard{width:100%;max-width:420px;background:var(--paper);border-top:4px solid var(--ink);padding:24px 22px 18px;box-shadow:var(--shadow);animation:up .25s ease-out}
.thead{display:flex;align-items:center;justify-content:space-between}
.thead .seal{width:52px;height:52px;font-size:26px}
.tstep{color:var(--ink2);font-size:13px}
.tcard h3{margin:16px 0 8px;font-family:var(--serif);font-size:22px;line-height:1.35}
.tbody{font-size:15px;min-height:168px}
.tbody p{margin:0 0 10px}
.tbody ol,.tbody ul{margin:0 0 10px;padding-left:22px}
.tbody li{margin:5px 0}
.tbody .path{font-family:var(--serif);font-weight:700;font-size:17px;padding:10px 12px;background:var(--chip);border-left:3px solid var(--gold)}
.tbody .chips{margin-top:0}
.tdots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.tdots i{width:7px;height:7px;border-radius:50%;background:var(--track)}
.tdots i.on{background:var(--seal);width:20px;border-radius:4px}

/* brand */
.brand{display:flex;align-items:center;gap:10px;color:var(--ink)}
.wordmark{display:block}
.tlogo{display:flex;align-items:center;gap:10px;color:var(--ink)}

/* crisis: 道心震盪 */
.chip.crit{background:#ff4b36;color:#1a0605;border-color:#ff4b36;font-weight:700;animation:pulse 1.1s ease-in-out infinite}
.hero.shaken{border-color:#ff4b36}
.hero.shaken::before,.hero.shaken::after{background:#ff4b36;opacity:1}
.crisis-card{position:relative;margin-top:14px;background:#22090a;color:#ffe9e4;border:2px solid #ff4b36;overflow:hidden;animation:crit 1.5s ease-in-out infinite}
.crisis-card .stripe{height:8px;background:repeating-linear-gradient(-45deg,#ff4b36 0 10px,#1a0605 10px 20px)}
.crisis-card .cb{padding:8px 14px 12px;text-align:center}
.cr-top{display:flex;align-items:center;justify-content:center;gap:8px}
.bolt{display:block;filter:drop-shadow(0 0 6px rgba(255,213,74,.9))}
.cr-title{margin:0;font-family:var(--serif);font-weight:900;font-size:28px;letter-spacing:.12em;color:#ff5b46;text-shadow:0 0 12px rgba(255,75,54,.95),2px 0 0 rgba(255,255,255,.14),-2px 0 0 rgba(0,190,255,.22);animation:jolt 2.6s steps(1) infinite}
.cr-line{margin:2px 0 8px;font-size:13.5px;color:#ffc9be}
.cr-line b{font-family:var(--serif);font-weight:900;font-size:22px;color:#ffd54a;padding:0 3px;text-shadow:0 0 10px rgba(255,213,74,.6)}
.cr-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cr-pips{display:flex;gap:6px}
.pip{width:22px;height:22px;border-radius:50%;border:2px dashed #ff7a66;display:grid;place-items:center;color:#1a0605;font-weight:900;font-size:12px}
.pip.on{background:#ffd54a;border:2px solid #ffd54a}
.cr-info{display:flex;flex-direction:column;text-align:left;font-size:12px;color:#ffb3a6;line-height:1.45}
.cr-info b{font-family:var(--serif);color:#fff}
.btn.crit{background:#ff4b36;border-color:#ff4b36;color:#1a0605;font-weight:900;letter-spacing:.06em;padding:8px 14px;font-size:14px}
body.crisis::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:15;animation:vig 2.2s ease-in-out infinite}
@keyframes crit{0%,100%{box-shadow:0 0 0 1px #6b120c,0 0 16px rgba(255,75,54,.35),inset 0 0 24px rgba(255,60,40,.2)}50%{box-shadow:0 0 0 1px #6b120c,0 0 30px rgba(255,75,54,.75),inset 0 0 40px rgba(255,60,40,.4)}}
@keyframes jolt{0%,88%,100%{transform:none}90%{transform:translate(-3px,1px) skewX(-3deg)}92%{transform:translate(3px,-1px)}94%{transform:translate(-2px,0)}96%{transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes vig{0%,100%{box-shadow:inset 0 0 70px rgba(255,60,40,.16)}50%{box-shadow:inset 0 0 120px rgba(255,60,40,.34)}}

/* collapsible slot groups */
.qtools{display:flex;justify-content:space-between;align-items:center;margin:8px 0 0;font-size:12.5px;color:var(--ink2)}
.mini{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.mini button{background:none;border:0;padding:4px 12px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.mini button.on{background:var(--ink);color:var(--bg)}
.gh{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--ink);padding:12px 2px 8px;margin-top:10px;cursor:pointer;text-align:left}
.gh-g{flex:none;width:32px;height:32px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:16px;border:1.5px solid var(--ink);border-radius:4px;transform:rotate(-3deg)}
.gh.alldone .gh-g{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.gh-n{font-family:var(--serif);font-weight:700;font-size:16px}
.gh-n small{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--ink2);margin-left:8px}
.gh-c{margin-left:auto;font-family:var(--serif);font-weight:700;color:var(--ink2)}
.gh.alldone .gh-c{color:var(--jade)}
.gh-chev{font-size:22px;color:var(--ink2);transition:transform .2s;line-height:1}
.gh.open .gh-chev{transform:rotate(90deg)}
.gb.shut{display:none}

/* resume card */
.cv{margin-top:16px;background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--ink);padding:16px 16px 14px;box-shadow:var(--shadow)}
.cv-h{display:flex;justify-content:space-between;align-items:flex-start}
.cv-h h3{margin:0;font-family:var(--serif);font-size:21px;letter-spacing:.12em}
.cv-h p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.cv-h .seal{width:40px;height:40px;font-size:20px}
.cv-grid{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 0 4px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cv-grid>div{padding:13px 4px 10px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cv-grid b{display:block;font-family:var(--serif);font-weight:900;font-size:25px;line-height:1.2}
.cv-grid span{font-size:12px;color:var(--ink2)}
.cv-sub{margin:14px 0 6px;font-family:var(--serif);font-weight:700;font-size:14px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);grid-template-columns:repeat(16,1fr);gap:3px}
.hc{display:block;aspect-ratio:1;border-radius:2px;background:var(--track)}
.hc.x{background:transparent}
.hc.l1{background:var(--jade);opacity:.4}
.hc.l2{background:var(--jade);opacity:.7}
.hc.l3{background:var(--jade)}
.hc.now{outline:1.5px solid var(--seal);outline-offset:1px}
.heat-legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:8px;font-size:11.5px;color:var(--ink2)}
.heat-legend .hc{width:12px;height:12px;aspect-ratio:auto}
.cv-foot{margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink2);text-align:center;font-family:var(--serif)}

/* hero enrichments */
.moon{position:absolute;top:22px;right:14px;width:66px;height:66px;pointer-events:none}
.xp em{margin-left:8px;font-style:normal;font-size:12px;color:var(--jade);border:1px solid var(--jade);border-radius:99px;padding:0 8px;line-height:1.6;align-self:center}
.stairs{display:flex;gap:8px;margin-top:14px;position:relative}
.sg{min-width:0}
.sg .pips{display:flex;gap:2px;align-items:flex-end;height:11px}
.sg .pips i{flex:1;height:5px;border-radius:1px;background:var(--track)}
.sg .pips i.done{background:var(--jade)}
.sg .pips i.now{background:var(--seal);height:11px}
.sg .pips i.lock{background:none;border:1px dashed var(--ink3)}
.sg span{display:block;margin-top:3px;font-size:10.5px;color:var(--ink2);white-space:nowrap}

/* swipe rows + reorder */
.swrow{position:relative;overflow:hidden;border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.sw-main{position:relative;z-index:2;background:var(--bg);touch-action:pan-y;transition:transform .22s,background .15s}
.sw-main.quest{border-bottom:0;cursor:grab}
.sw-main.pressing{background:var(--chip)}
.sw-lead,.sw-trail{position:absolute;top:0;bottom:0;display:flex;z-index:1}
.sw-lead{left:0;width:92px}
.sw-trail{right:0;width:152px}
.swb{flex:1;border:0;color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:var(--serif);letter-spacing:.08em}
.swb.pause{background:var(--jade)}
.swb.edit{background:var(--gold)}
.swb.del{background:var(--seal)}
.dots{flex:none;border:0;background:none;color:var(--ink3);font-size:20px;line-height:1;padding:6px 4px;cursor:pointer}
.swrow.dragging{opacity:.28}
.swrow.ghost{background:var(--paper);border:1px solid var(--jade);box-shadow:0 16px 30px -10px rgba(0,0,0,.5);transform:scale(1.02);pointer-events:none}
.swrow.ghost .sw-main{background:var(--paper)}
.drop-line{position:fixed;height:3px;border-radius:2px;background:var(--seal);z-index:84;pointer-events:none;box-shadow:0 0 8px var(--seal)}
.grp.drop-target .gh{outline:2px dashed var(--seal);outline-offset:-2px}
.gempty{padding:14px 4px;border-bottom:1px dashed var(--line);color:var(--ink3);font-size:13px}
body.dragging-list{user-select:none;-webkit-user-select:none}
.hintline{margin:6px 0 0;font-size:12px;color:var(--ink2)}

/* empty states, titles, tip */
.empty{text-align:center;padding:28px 12px 10px}
.empty .seal{width:46px;height:46px;font-size:22px;margin-bottom:12px}
.empty h3{margin:0 0 6px;font-family:var(--serif);font-size:18px}
.empty p{margin:0 auto 16px;max-width:290px;color:var(--ink2);font-size:13.5px}
button.chip{cursor:pointer;font:inherit;font-size:12px}
.info{border:1px solid var(--ink3);background:none;color:var(--ink2);width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;cursor:pointer;margin-left:8px;padding:0;vertical-align:middle}
.near-h{margin:16px 0 2px;font-family:var(--serif);font-weight:700;font-size:14px;color:var(--ink2)}
.near{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px 11px;cursor:pointer}
.near .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.near b{font-family:var(--serif);font-size:16px}
.near small{color:var(--ink2);font-size:12.5px}
.near .bar{margin-top:7px;height:5px}
.trow{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.trow .tmk{flex:none;width:26px;height:26px;border-radius:4px;display:grid;place-items:center;font-size:13px;font-weight:900;background:var(--track);color:var(--ink3)}
.trow.earned .tmk{background:var(--gold);color:#fff}
.trow b{font-family:var(--serif);font-size:15px;display:block}
.trow small{display:block;color:var(--ink2);font-size:12.5px}
.trow .bar{margin-top:6px;height:4px}
#tip{position:fixed;z-index:70;max-width:240px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.55;box-shadow:var(--shadow);display:none;pointer-events:none}
#tip.on{display:block}
#tip b{display:block;font-family:var(--serif);font-size:15px}
#tip .tp{margin-top:4px;opacity:.75;font-size:12px}
.sw-main.skillmain{padding:14px 0 12px;cursor:grab}

/* title icons */
.ticons{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:10px;margin-top:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.ticons::-webkit-scrollbar{display:none}
.ticons .tibtn{flex:none}
.near-h{display:flex;justify-content:space-between;align-items:baseline}
.near-h small{font-family:var(--sans);font-weight:400;color:var(--ink2);font-size:12px}
.ncard{padding:2px 2px 4px}
.tibtn{border:0;background:none;padding:0;cursor:pointer;line-height:0}
.nrow{display:flex;gap:12px;align-items:center}
.nic,.trow .tic{flex:none;line-height:0}

/* lab entry button */
.labbtn{display:block;border:0;background:none;padding:0;cursor:pointer;line-height:0}
.labbtn .seal{width:36px;height:36px;font-size:18px}

/* lab */
#lab{position:fixed;inset:0;z-index:50;display:none;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
#lab.on{display:flex;flex-direction:column}
.lab-in{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;max-width:520px;margin:0 auto}
.lab-top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px}
.lab-back{border:0;background:none;color:var(--ink);font-size:16px;font-weight:700;cursor:pointer;padding:6px 0;width:64px;text-align:left}
.lab-sp{width:64px}
.lab-title{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:900;font-size:19px;letter-spacing:.12em}
.lab-title .seal{width:28px;height:28px;font-size:15px}
.lab-seg{margin:0 16px}
.lab-scroll{flex:1;overflow-y:auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.lab-intro{margin:0 0 12px;font-size:12.5px;color:var(--ink2)}
.lab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lab-card{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--acc);padding:10px;min-height:150px;min-width:0;display:flex;flex-direction:column}
.lc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.lc-head>div{min-width:0;flex:1}
.lc-name{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font-family:var(--serif);font-weight:700;font-size:15px;padding:2px 0}
.lc-time{width:100%;border:0;background:none;color:var(--ink2);font-size:11px;padding:3px 0 4px}
.lc-badge{flex:none;min-width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.lc-items{flex:1;margin-top:2px}
.lc-item{display:flex;align-items:flex-start;gap:6px;padding:6px 0;font-size:12.5px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;border-bottom:1px dashed var(--line)}
.lc-cb,.lab-cb{flex:none;width:16px;height:16px;margin-top:2px;border:1.5px solid var(--ink3);border-radius:3px;display:grid;place-items:center;font-size:11px;color:transparent;line-height:1}
.lc-item.checked .lc-cb{background:var(--acc);border-color:var(--acc);color:#fff}
.lc-item.checked .lc-tx{text-decoration:line-through;opacity:.6}
.lc-tx{flex:1;min-width:0;word-break:break-word}
.lc-x,.lab-x{flex:none;border:0;background:none;color:var(--ink3);cursor:pointer;padding:0 2px;font-size:15px;line-height:1}
.lc-add{display:flex;gap:4px;margin-top:8px}
.lc-add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg2);border-radius:6px;padding:5px 7px;font-size:12px;color:var(--ink)}
.lc-add button{border:0;background:var(--acc);color:#fff;border-radius:6px;width:26px;cursor:pointer}
.lab-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.lab-sel{flex:1;min-width:0}
.lab-panel{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--ink);padding:16px;box-shadow:var(--shadow)}
.lab-t{font-family:var(--serif);font-size:20px;font-weight:900}
.lab-dots{display:flex;flex-wrap:wrap;gap:6px}
.lab-dot{flex:1;min-width:26px;height:32px;border:1px solid var(--line);background:var(--bg2);border-radius:4px;font-size:12px;color:var(--ink2);cursor:pointer;padding:0}
.lab-dot.done{background:var(--chip);color:var(--jade);border-color:transparent}
.lab-dot.current{background:var(--seal);color:#fff;border-color:var(--seal)}
.lab-dot.sel{outline:2px solid var(--gold);outline-offset:1px}
.lab-dot.cus{box-shadow:inset 0 -3px 0 var(--gold)}
.lab-sl{margin:16px 0 8px;font-family:var(--serif);font-weight:700;font-size:14px;color:var(--ink2)}
.lab-moods{display:flex;flex-wrap:wrap;gap:8px}
.lab-mood{border:1px solid var(--line);background:var(--bg2);border-radius:6px;padding:7px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
.lab-mood.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lab-task{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;font-size:14px}
.lab-task.done .lab-cb{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.lab-task.done .lab-tx{color:var(--ink2);text-decoration:line-through}
.lab-tx{flex:1;min-width:0;word-break:break-word}
.lab-tag{flex:none;font-size:10.5px;padding:1px 7px;border:1px solid var(--jade);color:var(--jade);border-radius:3px;margin-top:1px}
.lab-tag.side{border-color:var(--gold);color:var(--gold)}
.lab-task.dragging,.lc-item.dragging{opacity:.9;box-shadow:0 8px 16px rgba(0,0,0,.28);background:var(--paper)}
.lab-add{display:flex;gap:8px;margin-top:12px}
.lab-add .inp{flex:1;min-width:0}
.lab-act{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.lab-act b{font-family:var(--serif);font-size:15px}
.lab-cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lab-cal-h h3{margin:0;font-family:var(--serif);font-size:18px}
.lab-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.lab-dow{text-align:center;font-size:11px;color:var(--ink2);padding-bottom:2px}
.lab-cell{aspect-ratio:1;border:1px solid var(--line);background:var(--paper);border-radius:4px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;color:var(--ink);padding:0;overflow:hidden}
.lab-cell.blank{background:none;border:0;cursor:default}
.lab-cell.has{background:var(--chip);border-color:transparent}
.lab-cell.today{outline:2px solid var(--seal);outline-offset:-2px}
.lab-mini{font-size:9px;font-weight:700;color:var(--jade);line-height:1}
.lab-detail{margin-top:14px;background:var(--paper);border:1px solid var(--line);padding:14px;font-size:13px}
.lab-block{padding:0 0 12px;margin-bottom:12px;border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.lab-block:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.lab-block b{font-family:var(--serif);display:block;margin-bottom:6px}
.lab-tl{display:flex;gap:10px;padding:3px 0;font-size:12.5px}
.lab-tm{flex:none;width:44px;color:var(--jade);font-weight:700}
.lab-tl div div{color:var(--ink2)}
.lab-side-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.lab-side-row .inp{flex:1}
#lab, #lab input, #lab select, #lab textarea, #lab button{font-family:var(--sans);}
.lab-symb{font-size:19px;line-height:1;font-weight:400;display:inline-block;transform:translateY(1px)}
.lab-seg button{padding:11px 0}
.lab-title{font-family:var(--sans);font-weight:700;letter-spacing:.02em}
.lab-t{font-family:var(--sans);font-weight:700;font-size:18px}
.lab-cal-h h3{font-family:var(--sans);font-weight:700}
.lab-sl{font-family:var(--sans);font-weight:700;color:var(--ink2);opacity:.9}
.lab-act b{font-family:var(--sans);font-weight:700}
.lc-name{font-family:var(--sans);font-weight:700}
.lab-card{border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.lab-panel{border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.lab-detail{border-radius:14px;box-shadow:var(--shadow)}
.lab-dot,.lab-cell{border-radius:9px}
.lab-mood,.lab-task,.lc-item{border-radius:10px}
.lab-mood{padding:8px 13px}
.lab-task{padding:11px 4px}
.lc-item{padding:7px 6px}
.lc-add input,.lab-add input,.inline-add-row input{border-radius:8px}
.lc-add button,.lab-add button{border-radius:8px}

/* home carousel */
.carousel{display:flex;align-items:stretch;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel.small{margin-top:4px}
.cslide{flex:0 0 100%;min-width:0;scroll-snap-align:start;display:flex}
.cslide>*{flex:1;width:100%}
.dots-row{display:flex;justify-content:center;gap:6px;margin:9px 0 2px}
.dots-row i{width:6px;height:6px;border-radius:50%;background:var(--track);transition:width .2s,border-radius .2s}
.dots-row i.on{background:var(--seal);width:17px;border-radius:3px}
.tlog{background:var(--paper);border-left:1px solid var(--line);border-right:1px solid var(--line);padding:16px 18px 14px;box-shadow:var(--shadow);overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;box-sizing:border-box;max-height:300px}
.tlog-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
.tlog-h .t{font-family:var(--serif);font-weight:700;font-size:17px}
.tlog-h small{color:var(--ink2);font-size:12.5px}
.tlog-empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink2);font-size:13.5px;padding:6px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.nb{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;color:var(--ink2);cursor:pointer}
.nb .g{width:34px;height:34px;border-radius:5px;display:grid;place-items:center;border:1.5px solid var(--line);font-family:var(--serif);font-weight:900;font-size:17px;transition:transform .25s,background .25s}
.nb small{font-size:11px}
.nb.on{color:var(--ink)}
.nb.on .g{background:var(--seal);border-color:var(--seal);color:#fff;transform:rotate(-5deg)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(6,12,10,.55)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--paper);border-top:3px solid var(--ink);padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;animation:up .25s ease-out}
.panel h3{margin:0 0 4px;font-family:var(--serif);font-size:19px}
.panel textarea.inp{min-height:150px;font-size:12px}

/* toast */
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);opacity:0;z-index:90;background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-family:var(--serif);font-weight:700;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0);opacity:1}

/* ritual */
#ritual{position:fixed;inset:0;z-index:100;display:none;background:radial-gradient(circle at 50% 38%,#0f2a25 0,#050b0a 70%);color:#e9efe8;text-align:center;overflow:hidden}
#ritual.on{display:block}
#ritual.shake{animation:shake .5s}
.charge{position:absolute;left:50%;top:36%;width:154px;height:154px;margin:-77px 0 0 -77px;pointer-events:none}
.charge svg{width:100%;height:100%;transform:rotate(-90deg)}
.charge circle{fill:none;stroke-width:2.6}
.charge .ctrack{stroke:rgba(255,255,255,.08)}
.charge .cfill{stroke:#8be8d1;stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;filter:drop-shadow(0 0 6px rgba(139,232,209,.85));animation:charge 4.25s cubic-bezier(.3,.1,.2,1) forwards}
.rings i{position:absolute;left:50%;top:36%;width:50px;height:50px;margin:-25px 0 0 -25px;border:2px solid rgba(139,232,209,.75);border-radius:50%;animation:ring 2.6s ease-out infinite}
.rings i:nth-child(2){animation-delay:.85s}.rings i:nth-child(3){animation-delay:1.7s}
.particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.particles i{position:absolute;bottom:32%;width:4px;height:4px;border-radius:50%;background:#a6ecd9;box-shadow:0 0 9px 2px rgba(139,232,209,.85);opacity:0;animation-name:rise;animation-timing-function:ease-in;animation-fill-mode:forwards}
.burst{position:absolute;left:50%;top:36%;width:1px;height:1px;pointer-events:none}
.burst i{position:absolute;left:0;top:0;width:70px;height:2px;background:linear-gradient(90deg,#f0d78c,transparent);transform-origin:0 50%;opacity:0}
.burst.go i{animation:ray .75s ease-out forwards}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash 1s ease-out}
.rlines{position:absolute;left:0;right:0;top:56%;padding:0 24px}
.rlines p{margin:8px 0;font-family:var(--serif);font-size:19px;letter-spacing:.12em;animation:fadein .8s both}
.rlines p.boom{font-size:44px;font-weight:900;color:#f0d78c}
.halo{position:absolute;left:50%;top:14%;width:240px;height:240px;margin:0 0 0 -120px;border-radius:50%;background:radial-gradient(circle,rgba(240,215,140,.4),transparent 70%);animation:fadein 1.3s both;pointer-events:none}
.spark{position:absolute;left:50%;top:19%;width:5px;height:5px;background:#f0d78c;border-radius:50%;opacity:0;animation:spark 1.5s ease-out both;box-shadow:0 0 7px 2px rgba(240,215,140,.85);pointer-events:none}
.win{position:absolute;left:0;right:0;top:20%;padding:0 28px;animation:fadein 1s both}
.win .shift{font-size:12.5px;letter-spacing:.14em;color:#9fd9c8;margin:0 0 6px;opacity:0;animation:fadein .8s .15s both}
.win .seal{width:96px;height:96px;font-size:44px;animation:stamp .7s cubic-bezier(.2,1.3,.4,1) both}
.win h2{font-family:var(--serif);font-size:30px;margin:22px 0 6px;letter-spacing:.14em}
.win p{color:#a9bdb5;margin:0 0 24px}
.win .btn{border-color:#e9efe8;color:#e9efe8}

@keyframes sheen{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
@keyframes drift{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-70px)}}
@keyframes stamp{0%{opacity:0;transform:scale(2.8) rotate(-22deg)}70%{opacity:1;transform:scale(.92) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(9);opacity:0}}
@keyframes charge{to{stroke-dashoffset:0}}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}18%{opacity:1}100%{opacity:0;transform:translateY(-230px) scale(1.15)}}
@keyframes ray{0%{opacity:0;transform:rotate(var(--a)) scaleX(.25)}35%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) scaleX(1)}}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-2px)}}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

function stageIndex(){
  let idx = 0;
  for (let i=0;i<STAGES.length;i++){
    const s = STAGES[i];
    if (s.f && !S.user.foundation) break;
    if (S.user.cultivation >= s.at) idx = i; else break;
  }
  return idx;
}
function progress(){
  const i = stageIndex(), cur = STAGES[i], c = S.user.cultivation, next = STAGES[i+1];
  let target = null, label;
  if (next && next.f && !S.user.foundation){ target = BREAK.cultivation; label = '距離突破築基'; }
  else if (next){ target = next.at; label = '距離'+next.name; }
  else label = '金丹尚未開放';
  if (target == null) return {i,cur,pct:100,left:0,label};
  return {i,cur,pct:clamp((c-cur.at)/(target-cur.at)*100,0,100),left:Math.max(0,target-c),label};
}
function practiceDaySet(){
  const set = new Set(S.events.filter(e=>e.type==='practice').map(e=>e.date));
  S.repairs.forEach(r=>set.add(r.missed));
  return set;
}
function streakInfo(){
  const t = today(), y = addDays(t,-1), dby = addDays(y,-1), days = practiceDaySet();
  const back = d => { let n = 0; while (days.has(d)){ n++; d = addDays(d,-1); } return n; };
  let state = 'normal', streak = 0;
  if (!days.has(y) && days.has(dby)){ state = 'shaken'; streak = back(dby); }
  else if (days.has(t)) streak = back(t);
  else if (days.has(y)) streak = back(y);
  const sorted = [...days].sort(); let run = 0, best = 0, prev = null;
  sorted.forEach(d => { run = (prev && diffDays(d,prev)===1) ? run+1 : 1; best = Math.max(best,run); prev = d; });
  if (best > S.user.longestStreak) S.user.longestStreak = best;
  return {streak,state,days};
}

  const p = [];
  if (r.xp) p.push('+'+r.xp+' 修為');
  for (const k in (r.attrs||{})) if (r.attrs[k]) p.push('+'+r.attrs[k]+' '+ATTR_NAME[k]);
  if (r.daoHeart) p.push('+'+r.daoHeart+' 道心');
  return p.join('　');
};

/* ---------- mutations ---------- */
function addEvent(ev){
  if (ev.key && S.events.some(e=>e.key===ev.key)) return false;
  S.events.push({id:uid(),ts:Date.now(),date:today(),rewards:{},...ev});
  return true;
}
function removeEvent(key){
  const i = S.events.findIndex(e=>e.key===key);
  return i<0 ? null : S.events.splice(i,1)[0];
}
function applyRewards(r,sign=1){
  S.user.cultivation = Math.max(0, S.user.cultivation + sign*(r.xp||0));
  for (const k in (r.attrs||{})) S.attrs[k] = Math.max(0, S.attrs[k] + sign*r.attrs[k]);
  S.user.daoHeart = clamp(S.user.daoHeart + sign*(r.daoHeart||0), 0, 100);
}
function checkStage(){
  const idx = stageIndex();
  if (idx > S.user.stageReached){
    for (let i=S.user.stageReached+1;i<=idx;i++) addEvent({type:'growth',key:'stage:'+i,title:'進境：'+STAGES[i].name,note:'修為累積，境界提升。'});
    S.user.stageReached = idx;
    toast('進境：'+STAGES[idx].name);
  }
}
function syncRepair(){
  const t = today(), y = addDays(t,-1), dby = addDays(y,-1), q = questCountOn(t);
  S.repairs = S.repairs.filter(r => {
    if (r.by === t && q < 3){ removeEvent('repair:'+r.missed); return false; }
    return true;
  });
  const days = practiceDaySet();
  if (q >= 3 && !days.has(y) && days.has(dby)){
    S.repairs.push({missed:y,by:t});
    addEvent({type:'growth',key:'repair:'+y,title:'補昨日之功',note:'道心震盪已平復，連續修煉得以延續。'});
    toast('補昨日之功');
  }
}
function toggleQuest(id){
  const q = S.quests.find(x=>x.id===id); if (!q || !q.active) return;
  const key = 'q:'+id+':'+today();
  const ex = removeEvent(key);
  if (ex) applyRewards(ex.rewards,-1);
  else {
    const rewards = {xp:q.xp, attrs:{[q.attr]:q.ar}};
    addEvent({type:'practice',src:'quest',key,title:q.name,note:q.desc,rewards});
    applyRewards(rewards);
    ui.stamped = id;
    const act = S.quests.filter(x=>x.active);
    if (act.every(x=>S.events.some(e=>e.key==='q:'+x.id+':'+today()))) toast('今日一課，功德圓滿。');
  }
  syncRepair(); checkStage(); save(); render();
}
function seedDays(n){
  const t = today();
  let act = S.quests.filter(q=>q.active), synth = !act.length;
  if (synth) act = [{id:'demo1',name:'體驗修煉',attr:'heart',xp:5,ar:10},{id:'demo2',name:'體驗鍛鍊',attr:'body',xp:5,ar:10},{id:'demo3',name:'體驗悟道',attr:'wisdom',xp:5,ar:10}];
  for (let k=n;k>=1;k--){
    const date = addDays(t,-k);
    for (let j=0;j<3;j++){
      const q = act[(k+j)%act.length], key = (synth?'demo:':'q:')+q.id+':'+date+':'+j, rewards = {xp:q.xp,attrs:{[q.attr]:q.ar}};
      if (addEvent({type:'practice',src:synth?'demo':'quest',key,title:q.name,note:synth?'測試資料':q.desc,rewards,date,ts:Date.now()-k*864e5+j})) applyRewards(rewards);
    }
  }
  if (diffDays(t,S.user.createdAt) < n) S.user.createdAt = addDays(t,-n);
}

/* ---------- toast / sheet / ritual ---------- */
let toastT;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('on'),2200); }
function sheet(html){ const s = $('#sheet'); s.innerHTML = '<div class="scrim" data-act="closeSheet"></div><div class="panel">'+html+'</div>'; s.classList.add('on'); }
function closeSheet(){ const s = $('#sheet'); s.classList.remove('on'); s.innerHTML = ''; }

function ritual(){
  if (ui.ritual) return; ui.ritual = true;
  const r = $('#ritual'); r.className = 'on';
  const fromName = STAGES[stageIndex()].name;
  r.innerHTML = '<div class="charge"><svg viewBox="0 0 120 120"><circle class="ctrack" cx="60" cy="60" r="52"/><circle class="cfill" cx="60" cy="60" r="52"/></svg></div>'
    + '<div class="rings"><i></i><i></i><i></i></div><div class="particles" id="rp"></div><div class="burst" id="rb"></div>'
    + '<div class="flash"></div><div class="rlines" id="rl"></div>';
  const spawnT = setInterval(()=>{
    const rp = document.getElementById('rp'); if (!rp) return;
    const i = document.createElement('i');
    i.style.left = (44+Math.random()*12).toFixed(1)+'%';
    i.style.animationDuration = (2+Math.random()*1.3).toFixed(2)+'s';
    rp.appendChild(i);
    setTimeout(()=>i.remove(),3600);
  }, 190);
  const lines = ['天地靈氣開始聚集……','經脈震動……','丹田靈氣壓縮……','轟！'];
  lines.forEach((t,i)=>setTimeout(()=>{
    const p = document.createElement('p'); p.textContent = t;
    if (i===3){
      p.className = 'boom'; r.querySelector('.flash').classList.add('go'); r.classList.add('shake');
      clearInterval(spawnT);
      const b = document.getElementById('rb');
      if (b){ let rays = ''; for (let k=0;k<16;k++) rays += '<i style="--a:'+(k*22.5)+'deg"></i>'; b.innerHTML = rays; b.classList.add('go'); }
    }
    $('#rl').appendChild(p);
  }, 800 + i*1150));
  setTimeout(()=>{
    clearInterval(spawnT);
    S.user.foundation = true; S.user.stageReached = stageIndex();
    const toName = STAGES[S.user.stageReached].name;
    addEvent({type:'growth',key:'bt:foundation',title:'突破：築基成功',note:'靈氣壓縮成基，踏入築基境。',rewards:{daoHeart:5}});
    applyRewards({daoHeart:5}); save();
    let sparks = '';
    for (let k=0;k<12;k++){
      const ang = Math.random()*Math.PI*2, dist = 65+Math.random()*80;
      sparks += '<i class="spark" style="--dx:'+(Math.cos(ang)*dist).toFixed(0)+'px;--dy:'+(Math.sin(ang)*dist).toFixed(0)+'px;animation-delay:'+(Math.random()*0.5).toFixed(2)+'s"></i>';
    }
    r.className = 'on';
    r.innerHTML = '<div class="flash go"></div><div class="halo"></div>'+sparks
      + '<div class="win"><div class="shift">'+esc(fromName)+' → '+esc(toName)+'</div><div class="seal">築基</div><h2>築基成功</h2><p>靈氣已凝成根基。修仙之路，才剛開始。</p><button class="btn" data-act="closeRitual">踏上仙途</button></div>';
  }, 800 + 4*1150 + 800);
}

function skillStage(s){
  const L = LADDER[s.name] || GEN; let i = 0;
  L.forEach((x,k)=>{ if (s.count>=x[1]) i = k; });
  const nx = L[i+1];
  return {name:L[i][0], next:nx, need:nx?nx[1]-s.count:0, pct:nx?(s.count-L[i][1])/(nx[1]-L[i][1])*100:100};
}

function trialStats(x){
  const L = [...(x.logs||[])].sort((a,b)=>a.date<b.date?-1:1), G = x.goals||[], n = L.length;
  const avg = (rows,k) => rows.length ? rows.reduce((a,l)=>a+l[k],0)/rows.length : 0;
  const share = (k,v) => n ? L.filter(l=>l[k]===v).length/n : 0;
  let trend = 0;
  if (n>=4){ const h = Math.floor(n/2); trend = avg(L.slice(n-h),'fun') - avg(L.slice(0,h),'fun'); }
  return {gDone:G.filter(g=>g.done).length, gTotal:G.length, n, mins:L.reduce((a,l)=>a+(l.minutes||0),0),
    fun:avg(L,'fun'), diff:avg(L,'diff'), self:share('drive','self'), forced:share('drive','forced'), up:share('energy','up'), down:share('energy','down'), trend};
}
function trialHint(s){
  if (s.n < 3) return '記錄還不到 3 天，判斷依據偏少，可以再多試幾天。';
  const rate = s.gTotal ? s.gDone/s.gTotal : 0;
  let t;
  if (s.fun>=3.8 && s.self>=0.5 && s.down<=0.3) t = '有趣程度高，也多半是主動想做，資料偏向「此道可修」。';
  else if (s.fun<=2.5 && s.forced>=0.5) t = '多半是逼自己在做，也不太有趣，資料偏向「暫不適合」。';
  else t = '訊號有好有壞，可以選「再試一週」多收集一些感受。';
  if (rate<0.5 && s.fun>=3.5) t += '目標完成率偏低但不無聊，可能是目標太大或時間不夠，不一定是不適合。';
  return t;
}

function radar(){
  const cx = 160, cy = 166, R = 100, NR = 128, best = attrBest();
  const ang = i => -Math.PI/2 + i*2*Math.PI/5;
  const P = (i,r) => [cx+Math.cos(ang(i))*r, cy+Math.sin(ang(i))*r];
  const fp = a => a[0].toFixed(1)+','+a[1].toFixed(1);
  const ring = f => ATTRS.map((_,i)=>fp(P(i,R*f))).join(' ');
  const tierR = v => { let i = 0; TIERS.forEach((t,j)=>{ if (v>=t) i = j; }); return i>=5 ? R : Math.max(6, R*(i+(v-TIERS[i])/(TIERS[i+1]-TIERS[i]))/5); };
  const data = ATTRS.map(([k],i)=>P(i,tierR(S.attrs[k])));
  const dpts = data.map(fp).join(' ');
  let s = '<svg viewBox="0 0 320 320" role="img" aria-label="五大屬性靈盤">'
    + '<defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--glow);stop-opacity:.6"/><stop offset="1" style="stop-color:var(--jade);stop-opacity:.22"/></linearGradient>'

  ATTRS.forEach((_,i)=>{ const e = P(i,R); s += '<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="var(--line)"/>'; });
  const zero = ATTRS.every(([k])=>S.attrs[k]===0);

  if (!zero) data.forEach(d=>{ s += '<circle cx="'+d[0].toFixed(1)+'" cy="'+d[1].toFixed(1)+'" r="3.5" fill="var(--gold)" stroke="var(--paper)" stroke-width="1.5"/>'; });
  s += '<circle cx="'+cx+'" cy="'+cy+'" r="2.5" fill="var(--gold)"/>';

function resume(){

  const pdays = new Set(S.events.filter(e=>e.type==='practice').map(e=>e.date)).size;
  const qn = S.events.filter(e=>e.src==='quest').length;

  const counts = {}; S.events.forEach(e=>{ if (e.type==='practice') counts[e.date] = (counts[e.date]||0)+1; });
  const W = 16, dow = parse(t).getDay(), start = addDays(t,-((W-1)*7+dow));
  let heat = '';
  for (let w=0;w<W;w++) for (let d=0;d<7;d++){

    + '<div class="cv-sub">近 16 週修煉足跡</div><div class="heat">'+heat+'</div>'

}

function titleStats(){
  streakInfo();
  const pr = S.events.filter(e=>e.type==='practice');
  return {practiceN:pr.length, pdays:new Set(pr.map(e=>e.date)).size, longest:S.user.longestStreak, questN:S.events.filter(e=>e.src==='quest').length,
    cult:S.user.cultivation, foundation:S.user.foundation, attrs:S.attrs, daoHeart:S.user.daoHeart, skillsN:S.skills.length,
    works:S.skills.reduce((a,x)=>a+x.works.length,0), trialsDone:S.trials.filter(t=>t.status==='done').length};
}
function titleList(){
  const x = titleStats();
  return TITLES.map((t,i)=>{
    const g = t.get(x), cur = g[0], need = g[1];
    return {...t,i,cur,need,earned:S.titles.includes(t.id)||cur>=need,ratio:clamp(cur/need,0,1)};
  });
}
const ptxt = t => t.pct ? Math.round(t.ratio*100)+'%' : Math.min(Math.round(t.cur),t.need)+' / '+t.need+' '+t.unit;
let syncing = false;
function syncTitles(){
  if (syncing) return; syncing = true;
  try{
    const fresh = titleList().filter(t=>t.earned && !S.titles.includes(t.id));
    fresh.forEach(t=>{ S.titles.push(t.id); addEvent({type:'growth',key:'title:'+t.id,title:'獲得稱號：'+t.name,note:t.how}); });
    if (fresh.length) toast('獲得稱號：'+fresh[0].name+(fresh.length>1?' 等 '+fresh.length+' 項':''));
  } finally { syncing = false; }
}

function titlesBlock(){
  const TL = titleList(), byId = Object.fromEntries(TL.map(t=>[t.id,t]));
  const near = TL.filter(t=>!t.earned).sort((a,b)=>b.ratio-a.ratio||a.i-b.i).slice(0,4);
  let h = '<section class="block"><div class="block-h">稱號<small>已獲得 '+S.titles.length+' / '+TITLES.length+'<button class="info" data-act="titlesOpen" aria-label="稱號說明">?</button></small></div>';
  h += S.titles.length
    ? '<div class="ticons">'+S.titles.map(id=>'<button class="tibtn" data-act="tip" data-id="'+id+'" aria-label="'+esc(byId[id].name)+'">'+titleIcon(id,true,46)+'</button>').join('')+'</div>'
    : '<p class="note" style="margin:10px 0 0">還沒有稱號，完成下面任一項就會獲得。</p>';
  if (near.length){
    h += '<div class="near-h">接近達成<small>左右滑動查看</small></div>'
      + '<div class="carousel small" id="nearCarousel">'+near.map(t=>'<div class="cslide"><button class="near ncard" data-act="tip" data-id="'+t.id+'"><div class="nrow"><span class="nic">'+titleIcon(t.id,false,44)+'</span><div style="flex:1;min-width:0"><div class="row1"><b>'+t.name+'</b><small>'+ptxt(t)+'</small></div>'

}

/* ---------- render ---------- */
function bindCarousel(containerId, dotsSel){
  const c = document.getElementById(containerId); if (!c) return;
  const dots = dotsSel ? [...document.querySelectorAll(dotsSel)] : []; if (!dots.length) return;
  let raf = 0;
  c.onscroll = () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const i = clamp(Math.round(c.scrollLeft / Math.max(1,c.clientWidth)), 0, dots.length-1);
      dots.forEach((d,idx)=>d.classList.toggle('on', idx===i));
    });
  };
}
function render(){
  $('#view').innerHTML = ({home,train,trial,log,me})[ui.tab]();
  if (document.body) document.body.classList.toggle('crisis', ui.tab==='home' && !!ui.shaken);
  if (ui.tab==='home') bindCarousel('homeCarousel','#homeDots i');
  if (ui.tab==='me') bindCarousel('nearCarousel','#nearDots i');
  if (ui.tab==='trial') S.trials.filter(x=>x.status==='active' && x.goals.length>1).forEach(x=>bindCarousel('goals-'+x.id,'#goalsDots-'+x.id+' i'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on', b.dataset.v===ui.tab));
  ui.stamped = null;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ document.querySelectorAll('[data-w]').forEach(el=>{ el.style.width = el.dataset.w+'%'; if (el.dataset.k) barMem[el.dataset.k] = Number(el.dataset.w); }); }));
}

const LAB_KEY = 'checkinLabData_v5';
const MOODS = [{id:'sun',emoji:'☀️',label:'晴'},{id:'cloud',emoji:'☁️',label:'陰'},{id:'rain',emoji:'🌧️',label:'暴雨'},{id:'low',emoji:'🫠',label:'低迷'},{id:'dim',emoji:'🕯️',label:'微光'},{id:'fire',emoji:'🔥',label:'燃起'}];
const LAB_ACC = ['var(--jade)','var(--gold)','var(--seal)','var(--ink2)'];
const LAB_TABS = [['routine','⊞','日常'],['checkin','✓','打卡'],['calendar','▦','月曆'],['archive','▣','封存']];
const lab = {open:false,tab:'routine',sel:null,cal:new Date(new Date().getFullYear(),new Date().getMonth(),1),detail:null,noClick:0};
const blockTouch = e => e.preventDefault();
const nowT = () => { const d = new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const labChar = a => { const t = a && a.name ? a.name.trim() : ''; return t ? t.charAt(0) : '幕'; };

function labData(){
  if (!S.lab){
    let d = null;
    try{ const raw = localStorage.getItem(LAB_KEY); if (raw) d = JSON.parse(raw); }catch(e){}
    S.lab = (d && typeof d==='object') ? d : {};
    S.lab.activities = S.lab.activities || []; S.lab.records = S.lab.records || {};
    if (S.lab.activeId===undefined) S.lab.activeId = null;
    if (S.lab.routine===undefined) S.lab.routine = null;
    save();
  }
  return S.lab;
}
const labActive = () => { const D = labData(); return D.activities.find(a=>a.id===D.activeId) || null; };
const labDayIdx = act => clamp(diffDays(today(),act.startDate)+1,1,act.totalDays);
const labTasks = (act,d) => { const o = (act.taskOverrides||{})[d]; return o ? o : {mainTask:act.mainTask,sideTasks:act.sideTasks}; };
function labOverride(act,d){
  act.taskOverrides = act.taskOverrides || {};
  if (!act.taskOverrides[d]){ const b = labTasks(act,d); act.taskOverrides[d] = {mainTask:b.mainTask,sideTasks:b.sideTasks.map(t=>({id:t.id,text:t.text}))}; }
  return act.taskOverrides[d];
}
function labShape(act,rec,d){
  const t = labTasks(act,d); rec.sideDone = rec.sideDone || {};
  t.sideTasks.forEach(x=>{ if (!(x.id in rec.sideDone)) rec.sideDone[x.id] = null; });
  if (rec.mood===undefined) rec.mood = null; if (rec.mainDone===undefined) rec.mainDone = null;
  return rec;
}
function labRec(act,d){
  const D = labData(); D.records[act.id] = D.records[act.id] || {};
  let r = D.records[act.id][d]; if (!r){ r = {mood:null,mainDone:null,sideDone:{}}; D.records[act.id][d] = r; }
  return labShape(act,r,d);
}
function labEffMain(act,d){
  const rs = labData().records[act.id] || {}, ds = Object.keys(rs).filter(x=>x<=d).sort();
  for (let i=ds.length-1;i>=0;i--){ const r = rs[ds[i]]; if (r && r.mainDone!==undefined && r.mainDone!==null) return r.mainDone; }
  return null;
}
function labEffSide(act,d,tid){
  const rs = labData().records[act.id] || {}, ds = Object.keys(rs).filter(x=>x<=d).sort();
  for (let i=ds.length-1;i>=0;i--){ const r = rs[ds[i]]; if (r && r.sideDone && r.sideDone[tid]!==undefined && r.sideDone[tid]!==null) return r.sideDone[tid]; }
  return null;
}
function labHasRec(act,d){
  const rec = labData().records[act.id] && labData().records[act.id][d]; if (!rec) return false;
  if (rec.mainDone || rec.mood) return true;
  if (rec.sideDone) for (const k in rec.sideDone) if (rec.sideDone[k]) return true;
  return false;
}
const labInRange = (act,d) => { const i = diffDays(d,act.startDate); return i>=0 && i<act.totalDays; };
function labEntries(act,rec,d){
  const t = labTasks(act,d), raw = [];
  if (rec.mainDone) raw.push({time:rec.mainDone.at,label:t.mainTask});
  t.sideTasks.forEach(x=>{ const sd = rec.sideDone[x.id]; if (sd) raw.push({time:sd.at,label:'支線・'+x.text}); });
  if (rec.mood){ const m = MOODS.find(mm=>mm.id===rec.mood.id); raw.push({time:rec.mood.at,label:m ? m.emoji+' '+m.label : ''}); }
  const map = {}; raw.forEach(r=>{ (map[r.time] = map[r.time]||[]).push(r.label); });
  return Object.keys(map).sort().map(t=>({time:t,labels:map[t]}));
}
function labRoutine(){
  const D = labData();
  if (!D.routine) D.routine = {quadrants:[0,1,2,3].map(()=>({id:uid(),name:'',timeRange:'',items:[]})),lastResetDate:today()};
  if (D.routine.lastResetDate!==today()){
    D.routine.quadrants.forEach(q=>q.items.forEach(it=>{ it.checked = false; }));
    D.routine.lastResetDate = today(); save();
  }
  return D.routine;
}

function labReorder(container,rowSel,getList,done){
  const LP = 380, MV = 14;
  container.querySelectorAll(rowSel).forEach(row=>{
    let timer = null, drag = false, y0 = 0, rh = 0, si = -1, pid = null;
    row.addEventListener('pointerdown', e=>{
      if (e.target.closest('input,select,textarea,.lc-x,.lab-x')) return;
      y0 = e.clientY; pid = e.pointerId;
      si = [...container.querySelectorAll(rowSel)].indexOf(row); rh = row.offsetHeight+6;
      timer = setTimeout(()=>{ drag = true; try{ row.setPointerCapture(pid); }catch(_){} row.classList.add('dragging'); document.addEventListener('touchmove',blockTouch,{passive:false}); try{ if (navigator.vibrate) navigator.vibrate(12); }catch(_){} },LP);
    });
    row.addEventListener('pointermove', e=>{
      if (drag){ row.style.transform = 'translateY('+(e.clientY-y0)+'px)'; row.style.position = 'relative'; row.style.zIndex = 5; }
      else if (timer && Math.abs(e.clientY-y0)>MV){ clearTimeout(timer); timer = null; }
    });
    const end = e=>{
      if (timer){ clearTimeout(timer); timer = null; }
      if (!drag) return;
      drag = false; document.removeEventListener('touchmove',blockTouch); row.classList.remove('dragging');
      const dy = e.clientY-y0; row.style.transform = row.style.position = row.style.zIndex = ''; lab.noClick = Date.now();
      const list = getList(), ni = clamp(si+Math.round(dy/rh),0,list.length-1);
      if (ni!==si){ const m = list.splice(si,1)[0]; list.splice(ni,0,m); done(); }
    };
    row.addEventListener('pointerup', end); row.addEventListener('pointercancel', end);
  });
}

}
function labCalendarHTML(){
  const acts = labData().activities.filter(a=>!a.hiddenFromCalendar);
  const y = lab.cal.getFullYear(), m = lab.cal.getMonth(), off = (new Date(y,m,1).getDay()+6)%7, dim = new Date(y,m+1,0).getDate();
  let grid = ['一','二','三','四','五','六','日'].map(x=>'<div class="lab-dow">'+x+'</div>').join('');
  for (let i=0;i<off;i++) grid += '<div class="lab-cell blank"></div>';
  for (let day=1;day<=dim;day++){
    const ds = y+'-'+pad(m+1)+'-'+pad(day), at = acts.filter(a=>labHasRec(a,ds) && labInRange(a,ds));
    grid += '<button class="lab-cell'+(at.length?' has':'')+(ds===today()?' today':'')+'" data-act="labCalDay" data-id="'+ds+'">'+day+(at.length?'<span class="lab-mini">'+esc(at.slice(0,2).map(labChar).join(' '))+'</span>':'')+'</button>';
  }
  return (acts.length ? '' : '<p class="note" style="margin:0 0 10px">還沒有主題週記錄，先到「打卡」建立一個吧。</p>')
    + '<div class="lab-cal-h"><h3>'+y+' 年 '+(m+1)+' 月</h3><div class="row" style="gap:6px"><button class="btn sm ghost" data-act="labCalGo" data-v="-1">‹</button><button class="btn sm ghost" data-act="labCalGo" data-v="1">›</button></div></div>'
    + '<div class="lab-cal">'+grid+'</div>'
    + (lab.detail ? '<div class="lab-detail">'+labDetailHTML(lab.detail)+'</div>' : '');
}
function labArchiveHTML(){
  const arch = labData().activities.filter(a=>a.archived);

    +'<button class="btn sm ghost" data-act="labView" data-id="'+a.id+'">查看</button><button class="btn sm ghost" data-act="labRestore" data-id="'+a.id+'">恢復</button>'

function labBind(){

function labRender(){
  const el = $('#lab');
  if (!lab.open){ el.className = ''; el.innerHTML = ''; return; }
  const old = el.querySelector('.lab-scroll'), top = old ? old.scrollTop : 0;
  const body = {routine:labRoutineHTML,checkin:labCheckinHTML,calendar:labCalendarHTML,archive:labArchiveHTML}[lab.tab]();

    + '<div class="lab-scroll">'+body+'</div></div>';

const labUp = () => { save(); labRender(); };

    sheet('<h3>調整日期與天數</h3><label class="f">開始日期</label><input class="inp" id="le-start" type="date" value="'+a.startDate+'">'

  },

  },
  labArchive(id){
    const D = labData(), a = D.activities.find(x=>x.id===id); if (!a) return;
    a.archived = true;
    if (D.activeId===id){ const n = D.activities.find(x=>!x.archived); D.activeId = n ? n.id : null; }
    lab.sel = null; labUp(); toast('已封存');
  },
  labRestore(id){ const a = labData().activities.find(x=>x.id===id); if (a){ a.archived = false; labUp(); } },
  labToggleCal(id){ const a = labData().activities.find(x=>x.id===id); if (a){ a.hiddenFromCalendar = !a.hiddenFromCalendar; labUp(); } },
  labView(id){ labData().activeId = id; lab.tab = 'calendar'; lab.sel = null; labUp(); },
  labDelAsk(id){

    lab.sel = null; save(); closeSheet(); labRender(); toast('已刪除');
  },
  labCalGo(_,v){ lab.cal = new Date(lab.cal.getFullYear(),lab.cal.getMonth()+Number(v),1); lab.detail = null; labRender(); },
  labCalDay(id){ if (Date.now()-lab.noClick<400) return; lab.detail = id; labRender(); },
  labRecDelAsk(id){

  },
  labRecDelDo(id){ const [aid,d] = id.split('|'), D = labData(); if (D.records[aid]) delete D.records[aid][d]; save(); closeSheet(); labRender(); }

let recTimer = null, recY = 0;
document.addEventListener('pointerdown', e=>{
  const b = e.target.closest && e.target.closest('.lab-block'); if (!b) return;
  recY = e.clientY; clearTimeout(recTimer);
  recTimer = setTimeout(()=>{ recTimer = null; lab.noClick = Date.now(); A.labRecDelAsk(b.dataset.aid+'|'+b.dataset.date); },600);

document.addEventListener('pointermove', e=>{ if (recTimer && Math.abs(e.clientY-recY)>10){ clearTimeout(recTimer); recTimer = null; } });
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{ if (recTimer){ clearTimeout(recTimer); recTimer = null; } }));

/* ---------- swipe / long-press reorder ---------- */
const LD = 92, TR = 152;
const SW = {kind:'quest',row:null,main:null,id:'',x0:0,y0:0,off0:0,mode:null,timer:null,pid:null,ghost:null,line:null,target:null,grab:0,raf:0,lastY:0};
function swClose(except){
  document.querySelectorAll('.swrow').forEach(r=>{
    if (r!==except && r._off){ r._off = 0; const m = r.querySelector('.sw-main'); m.style.transition = 'transform .22s'; m.style.transform = 'translateX(0)'; }
  });
}
const preventTouch = e => { if (SW.mode==='drag') e.preventDefault(); };
function dropTarget(y){
  const rows = [...document.querySelectorAll('#view .swrow')].filter(r=>r.dataset.id!==SW.id);
  const groups = [...document.querySelectorAll('#view .grp')];
  const pick = list => {
    for (const r of list){ const b = r.getBoundingClientRect(); if (y < b.top+b.height/2) return {before:r.dataset.id,lineY:b.top}; }
    return {before:null,lineY:list.length ? list[list.length-1].getBoundingClientRect().bottom : null};
  };
  if (!groups.length){ const t = pick(rows); return {slot:null,before:t.before,lineY:t.lineY}; }
  let best = null, bd = 1e9;
  groups.forEach(g=>{ const b = g.getBoundingClientRect(); const d = y<b.top ? b.top-y : (y>b.bottom ? y-b.bottom : 0); if (d<bd){ bd = d; best = g; } });
  const items = [...best.querySelectorAll('.swrow')].filter(r=>r.dataset.id!==SW.id);
  const t = pick(items);
  if (t.lineY==null) t.lineY = best.querySelector('.gb').getBoundingClientRect().top + 8;
  return {slot:best.dataset.slot,before:t.before,lineY:t.lineY};
}
function dragPaint(){
  const t = SW.target; if (!t || !SW.line) return;
  const v = $('#view').getBoundingClientRect();
  SW.line.style.left = v.left+'px'; SW.line.style.width = v.width+'px'; SW.line.style.top = (t.lineY-1.5)+'px';
  document.querySelectorAll('#view .grp').forEach(g=>g.classList.toggle('drop-target', t.slot!=null && g.dataset.slot===t.slot));
}
function dragStart(){
  const row = SW.row; if (!row || SW.mode!==null || SW.off0!==0) return;
  SW.mode = 'drag';
  try{ if (navigator.vibrate) navigator.vibrate(15); }catch(_){}
  document.body.classList.add('dragging-list');
  document.querySelectorAll('#view .gb.shut').forEach(g=>g.classList.remove('shut'));
  SW.main.classList.remove('pressing');
  const r = row.getBoundingClientRect();
  SW.grab = r.height/2;
  const g = row.cloneNode(true); g.classList.add('ghost');
  g.querySelectorAll('.sw-lead,.sw-trail').forEach(n=>n.remove());
  g.style.cssText = 'position:fixed;left:'+r.left+'px;top:'+(SW.y0-SW.grab)+'px;width:'+r.width+'px;z-index:85;';
  document.body.appendChild(g); SW.ghost = g; row.classList.add('dragging');
  SW.line = document.createElement('div'); SW.line.className = 'drop-line'; document.body.appendChild(SW.line);
  try{ SW.main.setPointerCapture(SW.pid); }catch(_){}
  document.addEventListener('touchmove', preventTouch, {passive:false});
  SW.lastY = SW.y0; SW.target = dropTarget(SW.lastY); dragPaint();
  const loop = () => {
    if (SW.mode!=='drag') return;
    const y = SW.lastY;
    if (y < 90) window.scrollBy(0,-12); else if (y > innerHeight-120) window.scrollBy(0,12);
    SW.target = dropTarget(y); dragPaint();
    SW.raf = requestAnimationFrame(loop);
  };
  SW.raf = requestAnimationFrame(loop);
}
function moveQuest(id,slot,before){
  const i = S.quests.findIndex(q=>q.id===id); if (i<0){ render(); return; }
  const q = S.quests[i], oldSlot = q.slot||'any', order0 = S.quests.map(x=>x.id).join();
  S.quests.splice(i,1);
  if (slot) q.slot = slot;
  let pos;
  if (before){ pos = S.quests.findIndex(x=>x.id===before); if (pos<0) pos = S.quests.length; }
  else {
    let last = -1; S.quests.forEach((x,k)=>{ if ((x.slot||'any')===(q.slot||'any')) last = k; });
    pos = slot && last>=0 ? last+1 : S.quests.length;
  }
  S.quests.splice(pos,0,q);
  const changed = slot && oldSlot!==slot, name = slot ? SLOTS.find(x=>x[0]===slot)[1] : '';
  if (changed) S.prefs.open['m:'+slot] = true;
  save(); render();
  if (changed) toast('「'+q.name+'」已移至'+name+'，時段改為'+name);
  else if (S.quests.map(x=>x.id).join()!==order0) toast('已調整順序');
}
function moveSkill(id,before){
  const i = S.skills.findIndex(x=>x.id===id); if (i<0){ render(); return; }
  const o0 = S.skills.map(x=>x.id).join(), k = S.skills.splice(i,1)[0];
  let pos = before ? S.skills.findIndex(x=>x.id===before) : -1; if (pos<0) pos = S.skills.length;
  S.skills.splice(pos,0,k); save(); render();
  if (S.skills.map(x=>x.id).join()!==o0) toast('已調整順序');
}
function dragEnd(cancel){
  cancelAnimationFrame(SW.raf); document.removeEventListener('touchmove',preventTouch);
  if (SW.ghost) SW.ghost.remove(); if (SW.line) SW.line.remove();
  document.body.classList.remove('dragging-list');
  const t = SW.target; SW.ghost = SW.line = null; SW.target = null;
  if (!cancel && t) { if (SW.kind==='skill') moveSkill(SW.id,t.before); else moveQuest(SW.id,t.slot,t.before); } else render();
}
document.addEventListener('pointerdown', e=>{
  const row = e.target.closest && e.target.closest('.swrow');
  if (!row){ swClose(null); return; }
  if (!e.target.closest('.sw-main') || e.target.closest('button,input,select,textarea,a')) return;
  if (e.pointerType==='mouse' && e.button!==0) return;
  swClose(row);
  Object.assign(SW,{row,kind:row.dataset.kind||'quest',main:row.querySelector('.sw-main'),id:row.dataset.id,x0:e.clientX,y0:e.clientY,off0:row._off||0,mode:null,pid:e.pointerId});
  SW.main.classList.add('pressing');
  clearTimeout(SW.timer); SW.timer = setTimeout(dragStart,420);
});
document.addEventListener('pointermove', e=>{
  if (!SW.row || e.pointerId!==SW.pid) return;
  if (SW.mode==='drag'){ SW.lastY = e.clientY; SW.ghost.style.top = (e.clientY-SW.grab)+'px'; return; }
  const dx = e.clientX-SW.x0, dy = e.clientY-SW.y0;
  if (SW.mode===null){
    if (Math.abs(dx)>8 && Math.abs(dx)>Math.abs(dy)*1.2){ SW.mode = 'swipe'; clearTimeout(SW.timer); SW.main.classList.remove('pressing'); SW.main.style.transition = 'none'; try{ SW.main.setPointerCapture(e.pointerId); }catch(_){} }
    else if (Math.abs(dx)>8 || Math.abs(dy)>10){ SW.mode = 'scroll'; clearTimeout(SW.timer); SW.main.classList.remove('pressing'); return; }
    else return;
  }
  if (SW.mode==='swipe'){ const off = clamp(SW.off0+dx,-TR-16,LD+16); SW.row._cur = off; SW.main.style.transform = 'translateX('+off+'px)'; }
});
function swEnd(e){
  if (!SW.row || e.pointerId!==SW.pid) return;
  clearTimeout(SW.timer); SW.main.classList.remove('pressing');
  if (SW.mode==='swipe'){
    const off = SW.row._cur||0; let f = 0;
    if (off > LD*0.45) f = LD; else if (off < -TR*0.4) f = -TR;
    SW.row._off = f; SW.main.style.transition = 'transform .22s'; SW.main.style.transform = 'translateX('+f+'px)';
  } else if (SW.mode==='drag') dragEnd(e.type==='pointercancel');
  SW.row = null; SW.mode = null;
}
document.addEventListener('pointerup', swEnd);
document.addEventListener('pointercancel', swEnd);
document.addEventListener('contextmenu', e=>{ if (e.target.closest && e.target.closest('.swrow')) e.preventDefault(); });

$('#brand').innerHTML = emblem(34,'b')+wordmark(22);
const cdTimer = setInterval(()=>{ const el = document.getElementById('cd'); if (el && ui.tab==='home') el.textContent = fmtLeft(); }, 30000);
if (cdTimer && cdTimer.unref) cdTimer.unref();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
